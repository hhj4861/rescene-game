name: Publish arcade to Cloudflare Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arcade-cloudflare
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ARCADE_BUILD_OUTPUT: ${{ github.workspace }}/dist-arcade-room
      ARCADE_TEST_OUTPUT: ${{ github.workspace }}/artifacts/browser
      ARCADE_BASE_PATH: /
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      PAGES_BRANCH: ${{ vars.CLOUDFLARE_PAGES_BRANCH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify existing deployment target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const {PAGES_PROJECT:project,PAGES_BRANCH:branch,CLOUDFLARE_ACCOUNT_ID:account,CLOUDFLARE_API_TOKEN:token}=process.env;
          if(!/^[a-z0-9][a-z0-9-]*$/.test(project||'')||!/^[a-zA-Z0-9][a-zA-Z0-9/_-]*$/.test(branch||'')||!/^[a-f0-9]{32}$/.test(account||'')||!token)throw new Error('Configure the confirmed Pages project, production branch, account and token first.');
          const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/pages/projects/${project}`,{headers:{Authorization:`Bearer ${token}`},signal:AbortSignal.timeout(15000)});
          if(!response.ok)throw new Error(`Existing Pages project lookup failed (${response.status}).`);
          const data=await response.json();
          if(!data.success||data.result?.name!==project||data.result.production_branch!==branch)throw new Error('Pages project or production branch does not match the configured target.');
          NODE
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcade-release-verification
          path: artifacts/browser
          retention-days: 7
      - name: Deploy verified build to the existing project
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-arcade-room --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ vars.CLOUDFLARE_PAGES_BRANCH }}
