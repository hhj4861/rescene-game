name: Arcade checks
on:
  push:
    branches: [main, 'feat/arcade-five-games-*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ARCADE_TEST_OUTPUT: ${{ github.workspace }}/artifacts/browser
      ARCADE_BUILD_OUTPUT: ${{ github.workspace }}/dist-arcade-room
      ARCADE_BASE_PATH: /
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcade-verification
          path: artifacts/browser
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: arcade-static-site
          path: dist-arcade-room
          retention-days: 7
